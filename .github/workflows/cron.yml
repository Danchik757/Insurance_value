name: CRON дообучение

on:
  schedule:
    - cron: '0 3 * * *'

jobs:
  incremental-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Устанавливаем прошлую модель
        uses: dawidd6/action-download-artifact@v3
        with:
          name: trained-model
          if_no_artifact_found: ignore

      - name: Устанавливаем базу данных
        uses: dawidd6/action-download-artifact@v3
        with:
          name: collector-database
          if_no_artifact_found: ignore

      - name: Incremental training
        run: python run.py -mode "update"

      - name: Модель
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/best_model.pkl
            models/encoders.pkl
            models/scaler_A.pkl
            models/versions/*.pkl
          retention-days: 90

      - name: База данных
        uses: actions/upload-artifact@v4
        with:
          name: collector-database
          path: |
            database.db
            db.meta
          if-no-files-found: error
          retention-days: 90